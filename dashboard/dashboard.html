<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="./style.css" />
</head>

<body>
    <div class="dashboard-header">
        <h1>Admin Dashboard</h1>
        <button id="logoutButton" class="logout-btn">Logout</button>
    </div>

    <div class="cards-container">
        <div class="card" id="modifyMenuCard">
            <h2>Modify Menu</h2>
            <p>Add, update, or delete menu items</p>
        </div>

        <div class="card" id="manageEmployeesCard">
            <h2>Manage Employees</h2>
            <p>Add or manage employee details</p>
        </div>

        <div class="card" id="viewOrdersCard">
            <h2>View Orders</h2>
            <p>Go to orders page</p>
        </div>

        <div class="card" id="viewRevenueCard">
            <h2>View Revenue</h2>
            <p>Check today's revenue</p>
        </div>
    </div>

    <!-- Revenue Section -->
    <div id="revenueContainer" style="display:none; max-width:1200px; margin:40px auto;">
        <div class="section-card">
            <h2>Today's Revenue</h2>
            <p><strong>Total Revenue: </strong><span id="todayRevenue">0</span></p>

            <h3>Completed Orders</h3>
            <table>
                <thead>
                    <tr>
                        <th>Order No</th>
                        <th>Order Type</th>
                        <th>Total Amount</th>
                        <th>Order Date-Time</th>
                    </tr>
                </thead>
                <tbody id="revenueOrdersTableBody"></tbody>
            </table>
        </div>
    </div>

    <script src="./dashboard.js"></script>
</body>

</html>
