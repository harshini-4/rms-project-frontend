<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View Orders</title>
    <link rel="stylesheet" href="./orders.css">
</head>
<body>

    <h1>All Orders</h1>

    <!-- Orders Table -->
    <div id="ordersContainer">
        <table>
            <thead>
                <tr>
                    <th>Order No</th>
                    <th>Order Type</th>
                    <th>Total Amount</th>
                    <th>Order Date-Time</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="ordersTableBody">
                <!-- JS will insert orders here -->
            </tbody>
        </table>
    </div>

    <!-- Order Details -->
    <div id="orderDetailsContainer" style="display: none;">
        <h2>Order Details</h2>
        <table>
            <thead>
                <tr>
                    <th>Item Name</th>
                    <th>Quantity</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody id="orderDetailsTableBody">
                <!-- JS will insert details here -->
            </tbody>
        </table>

        <p id="extraChargeMessage" style="color: red; font-weight: bold;"></p>

        <h3>Payment Details</h3>
        <table>
            <thead>
                <tr>
                    <th>Payment ID</th>
                    <th>Method</th>
                    <th>UPI ID</th>
                    <th>Time</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="paymentDetailsTableBody"></tbody>
        </table>

        <p><strong>Feedback Stars:</strong> <span id="feedbackStars"></span></p>
    </div>
    <button onclick="goDashboard()">Back</button>

    <script src="./view-orders.js"></script>
</body>
</html>
